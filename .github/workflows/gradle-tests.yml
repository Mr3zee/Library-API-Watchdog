name: Gradle tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'plugin-annotations/**'
      - 'report-aggregation/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'
  pull_request:
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'plugin-annotations/**'
      - 'report-aggregation/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'

# A newer push to the same branch cancels the runs of the older pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functional-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # The matrix jobs wait for this job. A cache save at its end only delays them.
          cache-read-only: true

      - name: Discover functional test tasks
        id: matrix
        run: |
          tasks="$(./gradlew -q :kotlin-library-api-watchdog-gradle-plugin:printCiFunctionalTestMatrix)"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  library-checks:
    name: Report aggregation tests and ABI checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run report aggregation tests
        run: ./gradlew :kotlin-library-api-watchdog-report-aggregation:test

      - name: Check the ABI dumps
        run: |
          ./gradlew \
            :kotlin-library-api-watchdog-gradle-plugin:checkKotlinAbi \
            :kotlin-library-api-watchdog-plugin-annotations:checkKotlinAbi \
            :kotlin-library-api-watchdog-report-aggregation:checkKotlinAbi

  exempts-fixer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run exempts fixer tests
        run: |
          ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests || {
            echo "Tests failed; retrying once."
            ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests
          }

  gradle-plugin-tests:
    name: Gradle plugin tests (${{ matrix.task }})
    needs: functional-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.functional-test-matrix.outputs.tasks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default of the action also requests the obsolete 'tools' package, which sdkmanager doesn't find.
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Gradle plugin tests
        env:
          FUNCTIONAL_TEST_TASK: ${{ matrix.task }}
        run: |
          ./gradlew ":kotlin-library-api-watchdog-gradle-plugin:$FUNCTIONAL_TEST_TASK" || {
            echo "Tests failed; retrying once."
            ./gradlew ":kotlin-library-api-watchdog-gradle-plugin:$FUNCTIONAL_TEST_TASK"
          }
