name: Gradle tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'plugin-annotations/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'

permissions:
  contents: read

jobs:
  functional-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Discover functional test tasks
        id: matrix
        run: |
          tasks="$(./gradlew -q :kotlin-library-api-watchdog-gradle-plugin:printCiFunctionalTestMatrix)"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  exempts-fixer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run exempts fixer tests
        run: |
          ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests || {
            echo "Tests failed; retrying once."
            ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests
          }

  gradle-plugin-tests:
    name: Gradle plugin tests (${{ matrix.task }})
    needs: functional-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.functional-test-matrix.outputs.tasks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Gradle plugin tests
        env:
          FUNCTIONAL_TEST_TASK: ${{ matrix.task }}
        run: |
          ./gradlew ":kotlin-library-api-watchdog-gradle-plugin:$FUNCTIONAL_TEST_TASK" || {
            echo "Tests failed; retrying once."
            ./gradlew ":kotlin-library-api-watchdog-gradle-plugin:$FUNCTIONAL_TEST_TASK"
          }
