name: Gradle tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'gradle-plugin-test/**'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'
  pull_request:
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'gradle-plugin-test/**'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'
  workflow_call:
    inputs:
      ref:
        description: 'The commit to test. Empty tests the commit of the caller.'
        type: string
        default: ''

# A newer run of the same event, branch, and tested commit cancels the older run. In a called workflow, `github` is the
# context of the caller, so the group starts with the name of this file and has the `ref` input.
concurrency:
  group: gradle-tests-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # A `pull_request` run of the Watchdog bot skips the tests. The Dev kit update and the Release workflows call this
  # workflow on the commit of their pull request.
  functional-test-matrix:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          # The matrix jobs wait for this job. A cache save at its end only delays them.
          cache-read-only: true

      - name: Discover functional test tasks
        id: matrix
        run: |
          tasks="$(./gradlew -q :gradle-plugin-test:printCiFunctionalTestMatrix)"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  library-checks:
    name: Unit tests and ABI checks
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run unit tests
        run: |
          ./gradlew \
            :build-logic:test \
            :gradle-plugin:test \
            :gradle-plugin:kotlin-library-api-watchdog-report-aggregation:test

      - name: Check the ABI dumps
        run: |
          ./gradlew \
            :gradle-plugin:checkKotlinAbi \
            :gradle-plugin:kotlin-library-api-watchdog-report-aggregation:checkKotlinAbi \
            :plugin-annotations:checkLegacyAbi

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  exempts-fixer-tests:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run exempts fixer tests
        run: |
          ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests || {
            echo "Tests failed; retrying once."
            ./gradlew :kotlin-library-api-watchdog-exempts-fixer:allTests
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gradle-plugin-tests:
    name: Gradle plugin tests (${{ matrix.task }})
    needs: functional-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.functional-test-matrix.outputs.tasks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default of the action also requests the obsolete 'tools' package, which sdkmanager doesn't find.
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run Gradle plugin tests
        env:
          FUNCTIONAL_TEST_TASK: ${{ matrix.task }}
        run: |
          ./gradlew ":gradle-plugin-test:$FUNCTIONAL_TEST_TASK" || {
            echo "Tests failed; retrying once."
            ./gradlew ":gradle-plugin-test:$FUNCTIONAL_TEST_TASK"
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}-${{ matrix.task }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
