name: Version alignment

on:
  push:
    branches:
      - main
    paths:
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/libs.versions.toml'
      - 'README.md'
      - 'docs/**'
      - 'scripts/verify-version-alignment.sh'
      - 'scripts/update-version.sh'
      - 'scripts/bump-after-release.sh'
      - 'scripts/changelog-section.sh'
      - 'scripts/insert-changelog-section.sh'
      - 'scripts/prepare-release.sh'
      - 'scripts/release-plan.sh'
      - 'scripts/release-notes.sh'
      - 'scripts/push-signed-commit.sh'
      - 'scripts/lib/project-version.sh'
      - 'scripts/release-tooling.test.mjs'
      - '.github/workflows/version-alignment.yml'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/libs.versions.toml'
      - 'README.md'
      - 'docs/**'
      - 'scripts/verify-version-alignment.sh'
      - 'scripts/update-version.sh'
      - 'scripts/bump-after-release.sh'
      - 'scripts/changelog-section.sh'
      - 'scripts/insert-changelog-section.sh'
      - 'scripts/prepare-release.sh'
      - 'scripts/release-plan.sh'
      - 'scripts/release-notes.sh'
      - 'scripts/push-signed-commit.sh'
      - 'scripts/lib/project-version.sh'
      - 'scripts/release-tooling.test.mjs'
      - '.github/workflows/version-alignment.yml'
  workflow_call:
    inputs:
      ref:
        description: 'The commit to check. Empty checks the commit of the caller.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # A `pull_request` run of the Watchdog bot skips the checks. The Release workflow calls this workflow on the commit of
  # its pull request.
  verify:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test release tooling
        run: node --test scripts/*.test.mjs

      - name: Verify version alignment
        run: ./scripts/verify-version-alignment.sh
