name: Release

# One run releases a version. Each job finds its finished work and skips it, so "Re-run failed jobs" or a new run with
# the same version and branch continues a failed release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, MAJOR.MINOR.PATCH. Run from main, or from release/MAJOR.MINOR.x for a backport.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIBRARY_VERSION: ${{ inputs.version }}
  RELEASE_BRANCH: prepare-release/${{ inputs.version }}

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.plan.outputs.tagged }}
      published: ${{ steps.release.outputs.published }}
      from_main: ${{ steps.plan.outputs.from_main }}
      latest: ${{ steps.plan.outputs.latest }}
      docs_version: ${{ steps.plan.outputs.docs_version }}
      next_part: ${{ steps.plan.outputs.next_part }}
    steps:
      # The plan reads the release tags.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan the release
        id: plan
        run: |
          plan="$(./scripts/release-plan.sh "$LIBRARY_VERSION" "$GITHUB_REF_NAME")"
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

      # The workflow creates the GitHub release after the upload, so the GitHub release marks a finished upload.
      - name: Find the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$LIBRARY_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check publication credentials
        env:
          KOTLIN_LIBRARY_SPACE_USERNAME: ${{ secrets.KOTLIN_LIBRARY_SPACE_USERNAME }}
          KOTLIN_LIBRARY_SPACE_PASSWORD: ${{ secrets.KOTLIN_LIBRARY_SPACE_PASSWORD }}
        run: ./scripts/check-publication-env.sh space

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Check release metadata
        run: |
          ./scripts/verify-version-alignment.sh
          node docs/scripts/sync-changelog.mjs --check

  prepare:
    name: Prepare the release pull request
    needs: check
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.branch.outputs.sha }}
      pr: ${{ steps.pr.outputs.pr }}
    env:
      TAGGED: ${{ needs.check.outputs.tagged }}
      NEXT_PART: ${{ needs.check.outputs.next_part }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      # The Watchdog bot (CONTRIBUTING.md) pushes the branch and opens the pull request, because a pull request of
      # GITHUB_TOKEN starts `pull_request` runs that wait for an approval. The test workflows skip the `pull_request`
      # runs of the bot, and this workflow calls them itself.
      - name: Get the token of the Watchdog bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WATCHDOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WATCHDOG_BOT_PRIVATE_KEY }}

      # The release branch has one commit on top of the commit of this run. A new run for a later commit, for example
      # with a fix for a failed test, makes the branch again. After the tag exists, every run uses the tagged commit.
      - name: Create or reuse the release branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if git fetch --quiet origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH" 2> /dev/null; then
            tip="$(git rev-parse "origin/$RELEASE_BRANCH")"
            if [[ "$TAGGED" == true ]]; then
              tagged="$(git rev-parse "v$LIBRARY_VERSION^{commit}")"
              if [[ "$tip" != "$tagged" ]]; then
                echo "$RELEASE_BRANCH is at $tip, but v$LIBRARY_VERSION is at $tagged. Reset the branch to the tag." >&2
                exit 1
              fi
            fi
            if [[ "$TAGGED" == true || "$(git rev-parse "$tip^")" == "$GITHUB_SHA" ]]; then
              echo "Reusing $RELEASE_BRANCH at $tip."
              echo "sha=$tip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$RELEASE_BRANCH doesn't start at $GITHUB_SHA. Making it again."
          elif [[ "$TAGGED" == true ]]; then
            echo "sha=$(git rev-parse "v$LIBRARY_VERSION^{commit}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/release-notes.sh "$LIBRARY_VERSION" > "$RUNNER_TEMP/release-notes.md"
          ./scripts/prepare-release.sh "$LIBRARY_VERSION" "$NEXT_PART" "$RUNNER_TEMP/release-notes.md"
          sha="$(./scripts/push-signed-commit.sh "$RELEASE_BRANCH" "Release $LIBRARY_VERSION")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Open or find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$(gh pr list --head "$RELEASE_BRANCH" --base "$GITHUB_REF_NAME" --state all --json number,state \
            --jq 'map(select(.state != "CLOSED")) | first | .number // empty')"
          if [[ -z "$pr" ]]; then
            if [[ "$TAGGED" == true ]]; then
              echo "v$LIBRARY_VERSION exists, but no open or merged pull request is from $RELEASE_BRANCH." >&2
              exit 1
            fi
            gh label create release --color 5319e7 --force \
              --description 'A pull request of the Release workflow. The release notes skip it.'
            gh pr create --base "$GITHUB_REF_NAME" --head "$RELEASE_BRANCH" --label release \
              --title "Release $LIBRARY_VERSION" \
              --body "The [Release workflow]($RUN_URL) merges this pull request after the publication. Don't merge it by hand."
            pr="$(gh pr view "$RELEASE_BRANCH" --json number --jq .number)"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  compiler-plugin-tests:
    name: Compiler plugin tests
    needs: [check, prepare]
    if: needs.check.outputs.tagged != 'true'
    uses: ./.github/workflows/compiler-plugin-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  gradle-tests:
    name: Gradle tests
    needs: [check, prepare]
    if: needs.check.outputs.tagged != 'true'
    uses: ./.github/workflows/gradle-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  docs-checks:
    name: Docs checks
    needs: [check, prepare]
    if: needs.check.outputs.tagged != 'true'
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  release-tooling-checks:
    name: Release tooling checks
    needs: [check, prepare]
    if: needs.check.outputs.tagged != 'true'
    uses: ./.github/workflows/version-alignment.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  benchmark:
    name: Benchmark baseline
    needs: [check, prepare]
    if: needs.check.outputs.tagged != 'true'
    uses: ./.github/workflows/benchmark-baseline.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  # The job builds every publication before it creates the tag. So a build failure leaves no tag, and a new run with a
  # fix makes the release branch again. After the tag, an upload failure needs no code change, and every run uploads the
  # tagged commit. The Space repository accepts a second upload of a version, so a rerun uploads every module again.
  publish:
    name: Tag and publish to Space
    needs: [check, prepare, compiler-plugin-tests, gradle-tests, docs-checks, release-tooling-checks, benchmark]
    # The checks skip a tagged commit, because the tag comes after them. Without a status function, a skipped check job
    # skips this job too.
    if: ${{ !cancelled() && !failure() && needs.check.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # The job creates the tag.
      contents: write
    steps:
      # The token can write to the repository, so only the tag step gets it, not the build.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          cache-disabled: true

      # The Build repository is build/repo of the repository root.
      - name: Build the publications
        run: ./gradlew publishAllPublicationsToBuildRepository

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$LIBRARY_VERSION" --jq .object.sha 2> /dev/null)"; then
            if [[ "$tagged" != "$SHA" ]]; then
              echo "v$LIBRARY_VERSION is at $tagged, but the release commit is $SHA." >&2
              exit 1
            fi
            echo "v$LIBRARY_VERSION exists at $SHA."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$LIBRARY_VERSION" -f "sha=$SHA" --silent
            echo "Created v$LIBRARY_VERSION at $SHA."
          fi

      - name: Upload to Space
        env:
          KOTLIN_LIBRARY_SPACE_USERNAME: ${{ secrets.KOTLIN_LIBRARY_SPACE_USERNAME }}
          KOTLIN_LIBRARY_SPACE_PASSWORD: ${{ secrets.KOTLIN_LIBRARY_SPACE_PASSWORD }}
        run: ./gradlew publishAllPublicationsToSpaceRepository

  # The tag points to the published commit of the release branch. The squash merge makes another commit, so the tag
  # isn't in the history of the target branch.
  github-release:
    name: Create the GitHub release
    needs: [check, prepare, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      # The job creates the GitHub release.
      contents: write
    steps:
      # The notes are the changelog section of the release commit.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          if gh release view "v$LIBRARY_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The GitHub release v$LIBRARY_VERSION exists."
            exit 0
          fi
          ./scripts/changelog-section.sh "$LIBRARY_VERSION" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "# Release notes of $LIBRARY_VERSION"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release create "v$LIBRARY_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$LATEST" \
            --title "$LIBRARY_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  merge:
    name: Merge the release pull request
    needs: [check, prepare, github-release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.prepare.outputs.pr }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Squash-merge the pull request
        run: |
          if [[ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" == MERGED ]]; then
            echo "Pull request #$PR is merged."
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA" \
              --subject "Release $LIBRARY_VERSION (#$PR)" --body ''
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" 2> /dev/null \
            || echo "$RELEASE_BRANCH is deleted."

  # A release from a maintenance branch adds its changelog section to main through a second pull request.
  main-changelog:
    name: Add the changelog section to main
    needs: [check, merge]
    if: ${{ !cancelled() && !failure() && needs.check.outputs.from_main != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CHANGELOG_BRANCH: release-changelog/${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Get the token of the Watchdog bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WATCHDOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WATCHDOG_BOT_PRIVATE_KEY }}

      - name: Open or find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          pr="$(gh pr list --head "$CHANGELOG_BRANCH" --base main --state all --json number,state \
            --jq 'map(select(.state != "CLOSED")) | first | .number // empty')"
          if [[ -z "$pr" ]]; then
            git show "v$LIBRARY_VERSION:CHANGELOG.md" > "$RUNNER_TEMP/released-changelog.md"
            ./scripts/insert-changelog-section.sh "$LIBRARY_VERSION" "$RUNNER_TEMP/released-changelog.md"
            node docs/scripts/sync-changelog.mjs
            if git diff --quiet; then
              echo "The changelog of main has the $LIBRARY_VERSION section."
              exit 0
            fi
            ./scripts/push-signed-commit.sh "$CHANGELOG_BRANCH" "Add the $LIBRARY_VERSION changelog section"
            gh label create release --color 5319e7 --force \
              --description 'A pull request of the Release workflow. The release notes skip it.'
            gh pr create --base main --head "$CHANGELOG_BRANCH" --label release \
              --title "Add the $LIBRARY_VERSION changelog section" \
              --body "The changelog section of the $LIBRARY_VERSION release from $GITHUB_REF_NAME."
            pr="$(gh pr view "$CHANGELOG_BRANCH" --json number --jq .number)"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Squash-merge the pull request
        if: steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          if [[ "$(gh pr view "$PR" --json state --jq .state)" != MERGED ]]; then
            gh pr merge "$PR" --squash --subject "Add the $LIBRARY_VERSION changelog section (#$PR)" --body ''
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CHANGELOG_BRANCH" 2> /dev/null \
            || echo "$CHANGELOG_BRANCH is deleted."

  # A merge with GITHUB_TOKEN doesn't start other workflows, so the job starts the docs deploy on main and waits for it.
  docs-deploy:
    name: Deploy the docs website
    needs: [check, merge, main-changelog]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCS_VERSION: ${{ needs.check.outputs.docs_version }}
    steps:
      - name: Run the docs workflow
        run: |
          output="$(gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$DOCS_VERSION")"
          echo "$output"
          run_url="$(grep -Eo 'https://[^[:space:]]+/actions/runs/[0-9]+' <<< "$output" | tail -n 1 || true)"
          if [[ -z "$run_url" ]]; then
            echo "gh didn't print the URL of the docs run. Find the run of Build docs website and check it." >&2
            exit 1
          fi
          gh run watch "${run_url##*/}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
