name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version, MAJOR.MINOR.PATCH. The workflow publishes the commit of its tag.'
        required: true
        type: string

permissions:
  contents: read

env:
  LIBRARY_VERSION: ${{ inputs.version }}
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # library.properties holds the next development version, so the workflow takes the version from the input.
      - name: Check the release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$LIBRARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$LIBRARY_VERSION" --silent 2> /dev/null; then
            echo "The version must be a release with a tag, for example 0.2.0. Got '$LIBRARY_VERSION'." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Check publication credentials
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: ./scripts/check-publication-env.sh maven-central

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check release metadata
        run: |
          ./scripts/verify-version-alignment.sh
          node docs/scripts/sync-changelog.mjs --check

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          cache-disabled: true

      - name: Upload Maven Central draft
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
