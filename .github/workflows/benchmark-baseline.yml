name: Benchmark baseline

# A change of `runs-on` or `java-version` changes the machine profile, so it needs a new baseline file.

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/src/*Main/**'
      - 'compiler-plugin/src/benchmark/**'
      - 'compiler-plugin/build.gradle.kts'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'gradle/**'
      - 'gradle.properties'
      - 'library.properties'
      - '.github/workflows/benchmark-baseline.yml'
  pull_request:
    paths:
      - 'compiler-plugin/src/*Main/**'
      - 'compiler-plugin/src/benchmark/**'
      - 'compiler-plugin/build.gradle.kts'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'gradle/**'
      - 'gradle.properties'
      - 'library.properties'
      - '.github/workflows/benchmark-baseline.yml'
  workflow_dispatch:
    inputs:
      record:
        description: 'Record the baseline file and upload it as an artifact instead of the comparison'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'The commit to measure. Empty measures the commit of the caller.'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # A `pull_request` run of the Watchdog bot skips the check. The Dev kit update and the Release workflows call this
  # workflow on the commit of their pull request.
  benchmark:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          cache-read-only: true

      - name: Compare with the baseline
        if: ${{ !inputs.record }}
        run: ./gradlew :kotlin-library-api-watchdog-compiler-plugin:benchmarkBaseline

      - name: Record the baseline
        if: ${{ inputs.record }}
        run: ./gradlew :kotlin-library-api-watchdog-compiler-plugin:benchmarkBaseline -Pbenchmark.baseline.record=true

      # The task writes no summary when it stops before the measurement, for example on a baseline of other settings.
      - name: Publish the summary
        if: always()
        env:
          SUMMARY: compiler-plugin/build/reports/benchmark-baseline/summary.md
        run: |
          if [[ -f "$SUMMARY" ]]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The benchmark baseline task wrote no summary. The log of the previous step has the error.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the recorded baseline
        if: ${{ inputs.record }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-baseline
          path: compiler-plugin/src/benchmark/baseline/*.properties
          retention-days: 30
