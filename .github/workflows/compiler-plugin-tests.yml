name: Compiler plugin tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'plugin-annotations/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/compiler-plugin-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run compiler plugin tests
        run: ./gradlew :kotlin-library-api-watchdog-compiler-plugin:allVersionedTests
