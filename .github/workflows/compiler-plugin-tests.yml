name: Compiler plugin tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'plugin-annotations/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/compiler-plugin-tests.yml'
  pull_request:
    paths:
      - 'compiler-plugin/**'
      - 'plugin-annotations/**'
      - 'gradle-conventions/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/compiler-plugin-tests.yml'

# A newer push to the same branch cancels the runs of the older pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run compiler plugin tests
        run: |
          ./gradlew :kotlin-library-api-watchdog-compiler-plugin:allTests || {
            echo "Tests failed; retrying once."
            ./gradlew :kotlin-library-api-watchdog-compiler-plugin:allTests
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit benchmark corpus
        run: ./gradlew :kotlin-library-api-watchdog-compiler-plugin:benchmarkCorpusAudit
