name: Publish development build

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Calculate development version
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          base_version="$(awk -F= '$1 == "version" { print substr($0, length($1) + 2) }' library.properties)"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version in library.properties, got: $base_version" >&2
            exit 1
          fi
          echo "value=${base_version}-dev-${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish development build to Space
        env:
          LIBRARY_VERSION: ${{ steps.version.outputs.value }}
          KOTLIN_LIBRARY_SPACE_USERNAME: ${{ secrets.KOTLIN_LIBRARY_SPACE_USERNAME }}
          KOTLIN_LIBRARY_SPACE_PASSWORD: ${{ secrets.KOTLIN_LIBRARY_SPACE_PASSWORD }}
        run: ./gradlew publishAllPublicationsToSpaceRepository
