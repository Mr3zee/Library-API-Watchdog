name: Build docs website

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'docs/**'
      - 'diagnostics.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  id-token: write
  pages: write
  contents: read

env:
  DOCS_OUTPUT: 'docs/build'
  DOKKA_OUTPUT: 'build/dokka/html'
  ASSEMBLE_DIR: '__docs_assembled'
  ASSEMBLE_ARTIFACT: 'assembled.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Test docs tooling
        working-directory: docs
        run: npm test

      # Docusaurus fails on a broken link or anchor, so this is the docs check as well.
      - name: Build the docs website
        working-directory: docs
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cross-check documentation examples
        run: >-
          ./gradlew :kotlin-library-api-watchdog-gradle-plugin:k240FunctionalTest
          --tests org.jetbrains.kotlinx.library.api.watchdog.DocsExamplesTest

      - name: Build Dokka API reference
        run: ./gradlew :dokkaGenerate

      - name: Add Dokka to the assembled website
        run: |
          mkdir -p ${{ env.ASSEMBLE_DIR }}/api
          cp -r ${{ env.DOCS_OUTPUT }}/. ${{ env.ASSEMBLE_DIR }}/
          cp -r ${{ env.DOKKA_OUTPUT }}/. ${{ env.ASSEMBLE_DIR }}/api/

      - name: Update sitemap.xml
        run: chmod +x scripts/update_sitemap.sh && ./scripts/update_sitemap.sh ${{ env.ASSEMBLE_DIR }}/sitemap.xml ${{ env.ASSEMBLE_DIR }}/api

      - name: Assemble file
        run: cd ${{ env.ASSEMBLE_DIR }} && zip -r ../${{ env.ASSEMBLE_ARTIFACT }} .

      - name: Save assembled artifact
        uses: actions/upload-artifact@v6
        with:
          name: library-api-watchdog-docs-assembled
          path: ${{ env.ASSEMBLE_ARTIFACT }}
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: library-api-watchdog-docs-assembled

      - name: Unzip artifact
        run: unzip -O UTF-8 -qq '${{ env.ASSEMBLE_ARTIFACT }}' -d publish

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
